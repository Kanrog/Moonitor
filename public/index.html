<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonitor</title>
    
    <link rel="icon" href="images/moonitor-logo.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e2e">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-container">
        <div style="width: 160px;"></div>
        <div class="header-title">
            <img src="images/moonitor-logo.png" alt="Moonitor Logo" class="header-logo">
            <h1>Moonitor</h1>
        </div>
        <div class="header-actions">
            <button id="cycle-btn" onclick="toggleCycleMode()" title="Toggle Auto-Cycle Highlight Mode">CYCLE ⚪</button>
            <a href="https://github.com/Kanrog/Moonitor" target="_blank" class="header-btn-link" title="View Source on GitHub">GitHub</a>
            <button onclick="openSettingsModal()" title="Settings & Themes">Settings</button>
        </div>
    </div>
    
    <div class="header-controls">
        <input type="text" id="manual-name" placeholder="Printer Name">
        <input type="text" id="manual-ip" placeholder="IP Address">
        <button onclick="addManualPrinter()">Add Printer</button>
        <button onclick="scanNetwork()" id="scan-btn">Scan Local Network</button>
    </div>

    <div class="searchlight-track" id="searchlight">
        <div class="searchlight-beam"></div>
    </div>

    <div id="scan-status-text" class="scan-status" style="margin-bottom: 5px;"></div>

    <div id="scan-results">
        <div id="scan-list" style="display: flex; flex-direction: column; gap: 6px; max-height: 150px; overflow-y: auto;"></div>
        <button onclick="addSelectedPrinters()" style="width: 100%; padding: 6px; font-size: 0.85rem;">Add Selected Printers</button>
    </div>

    <div class="grid" id="printer-grid"></div>

    <!-- Screen Switcher Arrow Button (Right Edge) -->
    <button id="screen-arrow-btn" class="side-arrow-btn" onclick="nextScreen()" title="Switch Screen" style="display: none;">&gt;</button>

    <!-- Edit Printer Modal -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-card">
            <h3>Edit Printer</h3>
            <input type="hidden" id="edit-old-ip">
            
            <label style="font-size: 0.85rem;">Printer Name:</label>
            <input type="text" id="edit-name" placeholder="Name">
            
            <label style="font-size: 0.85rem;">IP Address:</label>
            <input type="text" id="edit-ip" placeholder="IP Address">

            <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 8px; cursor: pointer; margin-top: 5px;">
                <input type="checkbox" id="edit-camera-enabled"> Enable Camera Feed
            </label>

            <label style="font-size: 0.85rem;">Camera Rotation:</label>
            <select id="edit-rotation">
                <option value="0">0° (Normal)</option>
                <option value="90">90° Clockwise</option>
                <option value="180">180° Upside Down</option>
                <option value="270">270° Clockwise</option>
            </select>

            <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 8px; cursor: pointer; margin-top: 5px;">
                <input type="checkbox" id="edit-mirror"> Mirror Camera (Horizontally)
            </label>

            <!-- Reorder Buttons -->
            <label style="font-size: 0.85rem; font-weight: bold; margin-top: 5px;">Display Position:</label>
            <div style="display: flex; gap: 8px;">
                <button type="button" onclick="shiftPrinterOrder(-1)" style="flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--surface);">⬆ Move Up</button>
                <button type="button" onclick="shiftPrinterOrder(1)" style="flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--surface);">⬇ Move Down</button>
            </div>

            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <button onclick="savePrinterEdit()" style="flex: 1;">Save</button>
                <button onclick="closeEditModal()" style="flex: 1; background: #45475a; color: #fff;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Settings & Themes Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-card">
            <h3>Settings & Themes</h3>
            
            <label style="font-size: 0.85rem; font-weight: bold; color: var(--text);">Auto-Cycle Settings:</label>
            <div class="custom-color-row">
                <span>Cycle Interval (sec):</span>
                <input type="number" id="setting-cycle-interval" value="15" min="3" max="300" onchange="saveCycleInterval()" style="width: 60px; text-align: center;">
            </div>

            <label style="font-size: 0.85rem; font-weight: bold; color: var(--text); margin-top: 5px;">Preset Themes:</label>
            <div class="theme-buttons-grid">
                <button class="theme-btn" onclick="applyPresetTheme('moonitor')">🌙 Moonitor Dark</button>
                <button class="theme-btn" onclick="applyPresetTheme('cyberpunk')">⚡ Cyberpunk Neon</button>
                <button class="theme-btn" onclick="applyPresetTheme('emerald')">🌲 Emerald Mint</button>
                <button class="theme-btn" onclick="applyPresetTheme('sunset')">🔥 Sunset Ember</button>
                <button class="theme-btn" onclick="applyPresetTheme('monolith')">⬛ Monolith</button>
                <button class="theme-btn" onclick="applyPresetTheme('purple')">🔮 Purple Vibe</button>
            </div>

            <label style="font-size: 0.85rem; font-weight: bold; color: var(--text); margin-top: 5px;">Custom Color Palette:</label>
            <div class="custom-color-row">
                <span>Background:</span>
                <input type="color" id="picker-bg" value="#1e1e2e" oninput="triggerCustomUpdate()">
            </div>
            <div class="custom-color-row">
                <span>Text Color:</span>
                <input type="color" id="picker-text" value="#cdd6f4" oninput="triggerCustomUpdate()">
            </div>
            <div class="custom-color-row">
                <span>Button Color:</span>
                <input type="color" id="picker-accent" value="#89b4fa" oninput="triggerCustomUpdate()">
            </div>
            <div class="custom-color-row">
                <span>Button Text Color:</span>
                <input type="color" id="picker-btn-text" value="#1e1e2e" oninput="triggerCustomUpdate()">
            </div>
            <div class="custom-color-row">
                <span>Outline / Surface:</span>
                <input type="color" id="picker-surface" value="#313244" oninput="triggerCustomUpdate()">
            </div>

            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <button onclick="closeSettingsModal()" style="width: 100%;">Close</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
