<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonitor</title>
    
    <link rel="icon" href="images/moonitor-logo.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e2e">

    <style>
        :root { 
            --bg: #1e1e2e; 
            --surface: #313244; 
            --overlay-bg: rgba(30, 30, 46, 0.92);
            --text: #cdd6f4; 
            --accent: #89b4fa; 
            --danger: #f38ba8; 
            --success: #10b981;
        }

        body { 
            font-family: system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 15px; 
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            position: relative;
        }

        .header-title {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .header-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        h1 { 
            text-align: center; 
            color: var(--accent); 
            margin: 0;
            font-size: 1.4rem;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .header-text-btn {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }
        .header-text-btn:hover {
            background: var(--accent);
            color: var(--bg);
        }

        .header-controls { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            margin-bottom: 10px; 
            flex-wrap: wrap; 
            align-items: center;
        }

        button { 
            background: var(--accent); 
            color: var(--bg); 
            border: none; 
            padding: 6px 14px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.danger { background: var(--danger); color: #fff; }

        input, select { 
            padding: 6px 10px; 
            border-radius: 4px; 
            border: 1px solid var(--surface); 
            background: var(--bg); 
            color: var(--text); 
            font-size: 0.80rem;
            outline: none;
        }

        .searchlight-track {
            display: none;
            width: 100%;
            max-width: 500px;
            height: 4px;
            background: var(--surface);
            border-radius: 2px;
            overflow: hidden;
            margin: 0 auto 10px auto;
            position: relative;
        }

        .searchlight-beam {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 35%;
            background: linear-gradient(90deg, transparent, var(--accent), #38bdf8, var(--accent), transparent);
            box-shadow: 0 0 12px #38bdf8;
            border-radius: 2px;
            animation: sweep 1.2s infinite ease-in-out alternate;
        }

        @keyframes sweep {
            0% { left: -10%; }
            100% { left: 75%; }
        }

        .pulse-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            animation: pulse 1s infinite alternate;
            margin-right: 6px;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px var(--accent); }
        }

        .scan-status {
            font-size: 0.85rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #scan-results {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 450px;
            margin: 0 auto 15px auto;
            background: var(--surface);
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            gap: 8px;
            z-index: 100;
        }

        .scan-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .scan-list-item label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            flex: 1;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            align-content: start;
        }

        @media (max-width: 1600px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }

        .card { 
            background: #000; 
            border-radius: 6px; 
            box-shadow: 0 3px 6px rgba(0,0,0,0.4); 
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--surface);
            aspect-ratio: 16 / 9;
            width: 100%;
        }

        .webcam-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            flex: 1;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .card-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 4;
        }

        .card-top-bar h3 { 
            margin: 0; 
            font-size: 0.9rem;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-badge { 
            padding: 2px 6px; 
            border-radius: 10px; 
            font-size: 0.7rem; 
            background: #45475a; 
            color: #fff;
            font-weight: bold;
            text-transform: uppercase;
        }

        .icon-btn { 
            background: rgba(0,0,0,0.5); 
            color: var(--text); 
            border: 1px solid #585b70;
            border-radius: 4px;
            padding: 2px 6px; 
            font-size: 0.75rem;
            cursor: pointer;
        }
        .icon-btn:hover { background: var(--surface); color: #fff; }
        .remove-btn:hover { background: var(--danger); border-color: var(--danger); color: #fff; }

        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--overlay-bg);
            backdrop-filter: blur(4px);
            z-index: 2;
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 12px;
            gap: 6px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .card:hover .card-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        .controls-row { 
            display: flex; 
            gap: 5px; 
            flex-wrap: wrap; 
        }

        .controls-row input, .controls-row select { 
            flex: 1; 
            min-width: 50px; 
            padding: 4px 6px;
            font-size: 0.75rem;
            background: var(--bg);
        }

        .controls-row button { 
            flex: 1; 
            padding: 4px 6px;
            font-size: 0.7rem;
        }

        .temp-footer {
            font-size: 0.75rem; 
            display: flex; 
            justify-content: space-between; 
            background: var(--bg); 
            padding: 5px 8px; 
            border-radius: 4px;
            border: 1px solid var(--surface);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-card {
            background: var(--surface);
            padding: 20px;
            border-radius: 8px;
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-card h3 { margin: 0 0 5px 0; color: var(--accent); }

        .theme-buttons-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }
        .theme-btn {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--surface);
            padding: 6px;
            font-size: 0.75rem;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
        }
        .theme-btn:hover {
            border-color: var(--accent);
        }

        .custom-color-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            gap: 10px;
        }
        .custom-color-row input[type="color"] {
            width: 40px;
            height: 28px;
            padding: 0;
            cursor: pointer;
            border: none;
            background: none;
        }

/* Mobile Responsive Layout */
@media (max-width: 768px) {
    #printer-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
    }

    .card {
        min-height: 380px;
        overflow: hidden;
    }

    .webcam-feed {
        height: 100%;
        width: 100%;
        object-fit: cover;
    }

    .card-overlay {
        max-height: 100%;
        overflow-y: auto;
        box-sizing: border-box;
    }
}

/* Touch Device Overlay Logic */
@media (hover: none) {
    .card:hover .card-overlay {
        opacity: 0;
        pointer-events: none;
    }
    
    .card.touch-active .card-overlay {
        opacity: 1;
        pointer-events: auto;
    }
}
    </style>
</head>
<body>
    <div class="header-container">
        <div style="width: 140px;"></div>
        <div class="header-title">
            <img src="images/moonitor-logo.png" alt="Moonitor Logo" class="header-logo">
            <h1>Moonitor</h1>
        </div>
        <div class="header-actions">
            <a href="https://github.com/Kanrog/Moonitor" target="_blank" class="header-text-btn" title="View Source on GitHub">GitHub</a>
            <button class="header-text-btn" onclick="openSettingsModal()" title="Settings & Themes">Settings</button>
        </div>
    </div>
    
    <div class="header-controls">
        <input type="text" id="manual-name" placeholder="Printer Name">
        <input type="text" id="manual-ip" placeholder="IP Address">
        <button onclick="addManualPrinter()">Add Printer</button>
        <button onclick="scanNetwork()" id="scan-btn">Scan Local Network</button>
    </div>

    <div class="searchlight-track" id="searchlight">
        <div class="searchlight-beam"></div>
    </div>

    <div id="scan-status-text" class="scan-status" style="margin-bottom: 5px;"></div>

    <div id="scan-results">
        <div id="scan-list" style="display: flex; flex-direction: column; gap: 6px; max-height: 150px; overflow-y: auto;"></div>
        <button onclick="addSelectedPrinters()" style="width: 100%; padding: 6px; font-size: 0.85rem;">Add Selected Printers</button>
    </div>

    <div class="grid" id="printer-grid"></div>

    <!-- Edit Printer Modal -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-card">
            <h3>Edit Printer</h3>
            <input type="hidden" id="edit-old-ip">
            
            <label style="font-size: 0.85rem;">Printer Name:</label>
            <input type="text" id="edit-name" placeholder="Name">
            
            <label style="font-size: 0.85rem;">IP Address:</label>
            <input type="text" id="edit-ip" placeholder="IP Address">

            <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 8px; cursor: pointer; margin-top: 5px;">
                <input type="checkbox" id="edit-camera-enabled"> Enable Camera Feed
            </label>

            <label style="font-size: 0.85rem;">Camera Rotation:</label>
            <select id="edit-rotation">
                <option value="0">0° (Normal)</option>
                <option value="90">90° Clockwise</option>
                <option value="180">180° Upside Down</option>
                <option value="270">270° Clockwise</option>
            </select>

            <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 8px; cursor: pointer; margin-top: 5px;">
                <input type="checkbox" id="edit-mirror"> Mirror Camera (Horizontally)
            </label>

            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <button onclick="savePrinterEdit()" style="flex: 1;">Save</button>
                <button onclick="closeEditModal()" style="flex: 1; background: #45475a; color: #fff;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Settings & Themes Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-card">
            <h3>Appearance & Themes</h3>
            
            <label style="font-size: 0.85rem; font-weight: bold; color: var(--text);">Preset Themes:</label>
            <div class="theme-buttons-grid">
                <button class="theme-btn" onclick="applyPresetTheme('moonitor')">🌙 Moonitor Dark</button>
                <button class="theme-btn" onclick="applyPresetTheme('cyberpunk')">⚡ Cyberpunk Neon</button>
                <button class="theme-btn" onclick="applyPresetTheme('emerald')">🌲 Emerald Mint</button>
                <button class="theme-btn" onclick="applyPresetTheme('sunset')">🔥 Sunset Ember</button>
                <button class="theme-btn" onclick="applyPresetTheme('monolith')">⬛ Monolith</button>
                <button class="theme-btn" onclick="applyPresetTheme('purple')">🔮 Purple Vibe</button>
            </div>

            <label style="font-size: 0.85rem; font-weight: bold; color: var(--text); margin-top: 5px;">Custom Color Palette:</label>
            <div class="custom-color-row">
                <span>Background:</span>
                <input type="color" id="picker-bg" value="#1e1e2e" oninput="triggerCustomUpdate()">
            </div>
            <div class="custom-color-row">
                <span>Text Color:</span>
                <input type="color" id="picker-text" value="#cdd6f4" oninput="triggerCustomUpdate()">
            </div>
            <div class="custom-color-row">
                <span>Button Color:</span>
                <input type="color" id="picker-accent" value="#89b4fa" oninput="triggerCustomUpdate()">
            </div>
            <div class="custom-color-row">
                <span>Outline / Surface:</span>
                <input type="color" id="picker-surface" value="#313244" oninput="triggerCustomUpdate()">
            </div>

            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <button onclick="closeSettingsModal()" style="width: 100%;">Close</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
